<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ignite Interior Decors">
  <title>Ignite Interior Decors</title>
  <!-- Brand gradient. Keep the stops in sync with the green custom properties in styles.css. -->
  <defs>
    <linearGradient id="ignite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ed84f" />
      <stop offset="0.45" stop-color="#35c76a" />
      <stop offset="1" stop-color="#0eb5a4" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="113" fill="url(#ignite)" />

  <!-- The wordmark's signature lowercase "i": circular dot plus a round ended stem. -->
  <g fill="#faf8f2">
    <circle cx="256" cy="128" r="42" />
    <rect x="219" y="196" width="74" height="230" rx="37" />
  </g>
</svg>
